name: Atualizar sitemap.xml

on:
  push:
    branches: [main]
    # Evita loop: ignora o próprio sitemap e as páginas geradas automaticamente.
    paths-ignore:
      - 'sitemap.xml'
      - 'produtos/**'
      - 'atelie/**'
      - 'blog.html'
      - 'blog/**'

  schedule:
    # Sincroniza produtos, Ateliê e Blog do Supabase a cada 15 minutos.
    - cron: '*/15 * * * *'

  workflow_dispatch: {}

permissions:
  contents: write

# Impede que execuções agendadas e manuais concorram e sobrescrevam os mesmos arquivos.
concurrency:
  group: gerar-site-estatico
  cancel-in-progress: false

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar scripts de geração
        run: |
          node --check scripts/generate-product-pages.js
          node --check scripts/generate-blog-pages.js

      - name: Gerar páginas estáticas dos produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-product-pages.js

      - name: Gerar páginas estáticas do Blog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-blog-pages.js

      - name: Verificar alterações
        id: verificar-alteracoes
        run: |
          if git diff --quiet -- sitemap.xml blog.html produtos atelie blog; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração encontrada."
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            echo "Foram encontradas alterações."
          fi

      - name: Commitar páginas e sitemap
        if: steps.verificar-alteracoes.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml blog.html produtos atelie blog

          git commit -m "chore: atualizar produtos, Ateliê, Blog e sitemap.xml"

          git push
