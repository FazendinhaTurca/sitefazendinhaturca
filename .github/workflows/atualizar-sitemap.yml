name: Atualizar sitemap.xml

on:
  push:
    branches: [main]
    # Evita loop: ignora o próprio sitemap e as páginas geradas automaticamente.
    paths-ignore:
      - 'sitemap.xml'
      - 'produtos/**'
      - 'atelie/**'
      - 'blog.html'
      - 'blog/**'

  schedule:
    # Sincroniza produtos, Ateliê e Blog do Supabase a cada 15 minutos.
    - cron: '*/15 * * * *'

  workflow_dispatch: {}

permissions:
  contents: write

# Impede que execuções agendadas e manuais concorram e sobrescrevam os mesmos arquivos.
concurrency:
  group: gerar-site-estatico
  cancel-in-progress: false

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar scripts de geração
        run: |
          node --check scripts/generate-product-pages.js
          node --check scripts/generate-blog-pages.js

      - name: Gerar páginas estáticas dos produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-product-pages.js

      - name: Gerar páginas estáticas do Blog
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-blog-pages.js

      - name: Validar sitemap e referências geradas
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import datetime
          import xml.etree.ElementTree as ET

          sitemap_path = Path('sitemap.xml')
          root = ET.parse(sitemap_path).getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9',
                'img': 'http://www.google.com/schemas/sitemap-image/1.1'}
          urls = root.findall('sm:url', ns)
          if not urls:
              raise SystemExit('Sitemap sem URLs.')

          locs = []
          today = datetime.date.today()
          for node in urls:
              loc = (node.findtext('sm:loc', namespaces=ns) or '').strip()
              if not loc:
                  raise SystemExit('Sitemap contém <url> sem <loc>.')
              parsed = urlparse(loc)
              if parsed.scheme != 'https' or parsed.netloc != 'www.fazendinhaturca.com.br' or parsed.query or parsed.fragment:
                  raise SystemExit(f'URL inválida no sitemap: {loc}')
              locs.append(loc)

              lastmod = node.findtext('sm:lastmod', namespaces=ns)
              if lastmod:
                  try:
                      value = datetime.date.fromisoformat(lastmod)
                  except ValueError:
                      raise SystemExit(f'lastmod inválido: {lastmod}')
                  if value > today:
                      raise SystemExit(f'lastmod futuro: {lastmod}')

              for image in node.findall('img:image', ns):
                  image_loc = (image.findtext('img:loc', namespaces=ns) or '').strip()
                  if not image_loc or not image_loc.startswith('https://'):
                      raise SystemExit(f'Imagem inválida no sitemap: {image_loc}')

          if len(locs) != len(set(locs)):
              raise SystemExit('Sitemap contém URLs duplicadas.')

          root_dir = Path('.')
          required_pages = ('index.html', 'produtos.html', 'atelie.html', 'blog.html')
          required_urls = {
              'https://www.fazendinhaturca.com.br/',
              'https://www.fazendinhaturca.com.br/produtos.html',
              'https://www.fazendinhaturca.com.br/atelie.html',
              'https://www.fazendinhaturca.com.br/blog.html',
          }

          for page in required_pages:
              if not (root_dir / page).is_file():
                  raise SystemExit(f'Página principal ausente no repositório: {page}')

          missing_required = required_urls - set(locs)
          if missing_required:
              raise SystemExit(
                  'Página principal ausente no sitemap: ' +
                  ', '.join(sorted(missing_required))
              )

          for loc in locs:
              path = urlparse(loc).path.lstrip('/')
              if path.startswith(('produtos/', 'atelie/', 'blog/')):
                  target = root_dir / path
                  if not target.is_file():
                      raise SystemExit(f'URL do sitemap sem arquivo correspondente: {loc}')

          print(f'Sitemap validado: {len(locs)} URLs, páginas principais presentes, sem duplicidades, URLs HTTPS válidas e páginas geradas presentes.')
          PY

      - name: Verificar alterações
        id: verificar-alteracoes
        run: |
          if git diff --quiet -- sitemap.xml blog.html produtos atelie blog; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração encontrada."
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            echo "Foram encontradas alterações."
          fi

      - name: Commitar páginas e sitemap
        if: steps.verificar-alteracoes.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml blog.html produtos atelie blog

          git commit -m "chore: atualizar produtos, Ateliê, Blog e sitemap.xml"

          git push
