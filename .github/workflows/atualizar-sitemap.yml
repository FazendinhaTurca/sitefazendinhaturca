name: Atualizar sitemap.xml

on:
  push:
    branches: [main]
    # Evita loop: ignora pushes que só alteraram o próprio sitemap
    # ou as páginas geradas automaticamente.
    paths-ignore:
      - 'sitemap.xml'
      - 'produtos/**'
      - 'atelie/**'

  schedule:
    # Sincroniza produtos do Supabase e recria as páginas estáticas
    # a cada 15 minutos.
    - cron: '*/15 * * * *'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar páginas estáticas dos produtos e sitemap.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-product-pages.js

      - name: Verificar alterações
        id: verificar-alteracoes
        run: |
          if git diff --quiet -- sitemap.xml produtos atelie; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração no sitemap.xml ou nas páginas de produtos."
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            echo "Foram encontradas alterações."
          fi

      - name: Commitar páginas e sitemap
        if: steps.verificar-alteracoes.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml produtos atelie

          git commit -m "chore: atualizar páginas de produtos e sitemap.xml"

          git push
